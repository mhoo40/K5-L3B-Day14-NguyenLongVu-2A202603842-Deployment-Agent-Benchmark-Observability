# ============================================================
# render.yaml — Infrastructure as Code cho Render
#
# Docs: https://render.com/docs/blueprint-spec
# Commit file này vào git → Render tự sync infrastructure.
# ============================================================

services:
  # ──────────────────────────────────────
  # Web Service — AI Agent (Part 6)
  # ──────────────────────────────────────
  - type: web
    name: ai-agent
    runtime: python
    rootDir: 06-lab-complete
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-cache
          property: connectionString
      - key: AGENT_API_KEY
        generateValue: true

  # ──────────────────────────────────────
  # Redis — Session, Rate Limit & Cost Guard
  # ──────────────────────────────────────
  - type: redis
    name: agent-cache
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# ============================================================
